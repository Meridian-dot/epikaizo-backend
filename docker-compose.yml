# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: epikaizo
      POSTGRES_PASSWORD: epikaizo
      POSTGRES_DB: epikaizo
    ports:
      - "5432:5432"
    volumes:
      - epikaizo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epikaizo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  epikaizo-db:
